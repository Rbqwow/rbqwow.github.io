<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">

    <div class="footer-col-wrapper">
      <div class="footer-col">
        <p class="feed-subscribe">
          <a href="{{ site.feed.path | default: 'feed.xml' | absolute_url }}">
            <svg class="svg-icon orange">
              <use xlink:href="{{ 'assets/minima-social-icons.svg#rss' | relative_url }}"></use>
            </svg><span>RSS 订阅</span>
          </a>
        </p>
      {%- if site.author %}
        <ul class="contact-list">
          {% if site.author.email -%}
            <li><a class="u-email" href="mailto:{{ site.author.email }}">{{ site.author.email }}</a></li>
          {%- endif %}
        </ul>
      {%- endif %}
      </div>
      <div class="footer-col">
        <p>{{ site.description }}</p>
      </div>
    </div>
    <div class="social-links">
      {%- include social.html -%}
    </div>
    <div class="thanks-to">
      <p align="center"><br>由 <a class="page-link" href="https://pages.github.com/" target="_blank">Github Pages</a>、<a class="page-link" href="https://www.cloudflare.com/" target="_blank">Cloudflare</a> 和 <a class="page-link" href="https://jekyllrb.com/" target="_blank">Jekyll</a> 以及 ♥ 强力驱动。</p>
    </div>

  </div>

</footer>
